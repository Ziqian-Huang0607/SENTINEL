[package]
name = "sentinel-scanner"
version = "0.1.0"
edition = "2021"
description = "SENTINEL core scanner engine: async TCP-connect scanning, service fingerprinting, CVE matching and deterministic risk scoring"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ipnet = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = { version = "0.5", optional = true, features = ["all"] }

[features]
default = []
# Optional privileged raw-socket path (ICMP echo probe). Requires root or
# CAP_NET_RAW. Off by default so the scanner always works unprivileged.
privileged = ["dep:socket2"]

[profile.release]
opt-level = 2
